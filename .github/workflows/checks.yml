name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openfile
          POSTGRES_DB: openfile
          POSTGRES_PASSWORD: ephemeral-ci-database
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U openfile -d openfile"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://openfile:ephemeral-ci-database@127.0.0.1:55432/openfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - run: npm install -g pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup.mjs
      - run: pnpm --filter @open-file/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:security
      - run: pnpm audit:security
      - run: pnpm --filter @open-file/server test
      - run: pnpm --filter @open-file/web test
      - run: pnpm build
      - name: Scan all Git history for secrets (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
